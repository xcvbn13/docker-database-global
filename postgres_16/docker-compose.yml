services:
  postgresdb:
    image: postgres:16
    container_name: postgres_16
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${POSTGRESDB_PORT:-5432}:5432"
    volumes:
      - postgres_16_db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - postgres_16_network

volumes:
  postgres_16_db_data:

networks:
  postgres_16_network:
    name: postgres_16_network
    driver: bridge
